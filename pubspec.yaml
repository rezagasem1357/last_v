name: last_version_test
description: "A delivery and accounting application for stores"
publish_to: 'none'
version: 2.2.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Barcode Scanner
  mobile_scanner: ^4.0.0
  
  # File Picker for Excel/PDF
  file_picker: ^8.0.0
  
  # Excel import/export
  excel: ^2.0.0
  
  # URL Launcher for email
  url_launcher: ^6.2.1
  
  # For Persian date formatting
  intl: ^0.19.0
  
  # PDF generation
  pdf: ^3.10.7
  
  # Printing and sharing PDF
  printing: ^5.11.1
  
  # Share files
  share_plus: ^7.2.2
  
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  # Assets for images
  assets:
    - assets/images/
  
  # Fonts for Persian text
  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir.ttf
        - asset: assets/fonts/Vazir-Bold.ttf
          weight: 700