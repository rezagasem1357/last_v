name: last_version_test
description: "A delivery and accounting application for stores"
publish_to: 'none'
version: 2.2.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  shared_preferences: ^2.2.2
  mobile_scanner: ^4.0.0
  file_picker: ^8.0.0
  excel: ^2.0.0
  url_launcher: ^6.2.1
  intl: ^0.19.0
  pdf: ^3.10.7
  printing: ^5.11.1
  share_plus: ^7.2.2
  
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
  
  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir.ttf
        - asset: assets/fonts/Vazir-Bold.ttf
          weight: 700